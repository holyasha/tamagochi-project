services:
  postgres:
    image: postgres:16-alpine
    container_name: tamagochi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tamagochi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tamagochi123}
      POSTGRES_DB: ${POSTGRES_DB:-tamagochi}
    ports:
      - "5432:5432"
    volumes:
      - tamagochi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamagochi"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    container_name: tamagochi-keycloak
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
    ports:
      - "8085:8080"
    volumes:
      - ./infra/keycloak/course-realm.json:/opt/keycloak/data/import/course-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    container_name: tamagochi-redis
    ports:
      - "6379:6379"
    volumes:
      - tamagochi-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    container_name: tamagochi-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tamagochi-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tamagochi-tempo-data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: tamagochi-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin-dev-only
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - tamagochi-grafana-data:/var/lib/grafana
    depends_on:
      - tempo

volumes:
  tamagochi-postgres-data:
  tamagochi-redis-data:
  tamagochi-tempo-data:
  tamagochi-grafana-data:
