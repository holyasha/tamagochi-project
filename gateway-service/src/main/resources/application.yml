server:
  port: ${SERVER_PORT:8088}
  reactive:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    timeout: 30m
    data:
      redis:
        namespace: tamagochi:gateway:sessions
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER:http://localhost:8085/realms/course}
        registration:
          keycloak:
            provider: keycloak
            client-id: course-bff
            client-secret: course-bff-secret
            authorization-grant-type: authorization_code
            scope: openid,profile,email
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 500
            response-timeout: 3s
          routes:
            - id: tamagochi-service
              uri: ${TAMAGOCHI_URL:http://localhost:8080}
              predicates:
                - Path=/api/tamagochis,/api/tamagochis/**,/api/owners,/api/owners/**
              filters:
                - TokenRelay=

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  observations:
    enable:
      spring.security: false
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      deployment.environment.name: local
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},trace_id=%X{traceId:-},span_id=%X{spanId:-}]"
