groups:
  - name: tamagochi_recording_rules
    interval: 5s
    rules:
      - record: course:tamagochi_requests:rate1m
        expr: |
          sum(rate(http_server_requests_seconds_count{job="tamagochirest",method="GET",uri="/api/tamagochis/{id}",status=~"2..|5.."}[1m]))

      - record: course:tamagochi_requests:increase1m
        expr: |
          sum(increase(http_server_requests_seconds_count{job="tamagochirest",method="GET",uri="/api/tamagochis/{id}",status=~"2..|5.."}[1m]))

      - record: course:tamagochi_error_ratio:rate1m
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="tamagochirest",method="GET",uri="/api/tamagochis/{id}",status=~"5.."}[1m]))
            or
            (0 * course:tamagochi_requests:rate1m)
          )
          /
          course:tamagochi_requests:rate1m

      - record: course:tamagochi_good_ratio:rate5m
        expr: |
          (
            sum(rate(http_server_requests_seconds_bucket{job="tamagochirest",method="GET",uri="/api/tamagochis/{id}",status="200",le="0.5"}[5m]))
            or
            (0 * sum(rate(http_server_requests_seconds_count{job="tamagochirest",method="GET",uri="/api/tamagochis/{id}",status=~"2..|5.."}[5m])))
          )
          /
          sum(rate(http_server_requests_seconds_count{job="tamagochirest",method="GET",uri="/api/tamagochis/{id}",status=~"2..|5.."}[5m]))

  - name: tamagochi_alerts
    interval: 5s
    rules:
      - alert: CourseTamagochiHighErrorRatio
        expr: course:tamagochi_error_ratio:rate1m > 0.2 and course:tamagochi_requests:increase1m >= 10
        for: 20s
        labels:
          job: tamagochirest
          severity: warning
          team: course
        annotations:
          summary: "Доля 5xx тамагочи выше 20 процентов"
          description: "Учебное правило: окно 1 минута, не менее 10 запросов, выдержка 20 секунд."
          dashboard_url: "http://localhost:3000/d/tamagochi-golden-signals"
          runbook_url: "http://localhost:3000/d/tamagochi-golden-signals?viewPanel=9"

      - alert: CourseScrapeTargetDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
          team: course
        annotations:
          summary: "Сервис {{ $labels.job }} недоступен для scrape"
          description: "Target {{ $labels.instance }} job {{ $labels.job }} не отвечает более 30 секунд."
