global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: tamagochi-local

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: tamagochirest
    metrics_path: /actuator/prometheus
    scrape_protocols: [OpenMetricsText1.0.0, PrometheusText0.0.4]
    static_configs:
      - targets: ["host.docker.internal:9080"]

  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    scrape_protocols: [OpenMetricsText1.0.0, PrometheusText0.0.4]
    static_configs:
      - targets: ["host.docker.internal:9088"]
