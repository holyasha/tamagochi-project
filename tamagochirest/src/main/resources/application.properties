spring.application.name=tamagochirest

# GraphiQL — интерактивная IDE для тестирования GraphQL-запросов.
# Доступна по адресу http://localhost:8080/graphiql после запуска приложения.
spring.graphql.graphiql.enabled=true

# Путь к GraphQL-endpoint
spring.graphql.path=/graphql

# Расположение GraphQL-схемы для Spring for GraphQL.
spring.graphql.schema.locations=classpath*:graphql/

# Расположение GraphQL-схемы для DGS.
# DGS использует свой собственный механизм поиска схемы, отдельный от Spring for GraphQL.
# По умолчанию: classpath*:schema/**/*.graphql* — нужно переопределить.
dgs.graphql.schema-locations=classpath*:graphql/**/*.graphqls

# Включаем интроспекцию схемы (удобно при разработке, отключите в продакшене)
spring.graphql.schema.introspection.enabled=true

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/tamagochi
spring.datasource.username=tamagochi
spring.datasource.password=tamagochi123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false

# Logging
logging.level.com.example.tamagochirest=DEBUG
logging.level.org.springframework.web=DEBUG
logging.include-application-name=false
logging.pattern.correlation=[${spring.application.name:},trace_id=%X{traceId:-},span_id=%X{spanId:-}]
logging.structured.format.file=ecs
logging.file.name=runtime-logs/tamagochirest-service.log

# OAuth 2.0 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/course
spring.security.oauth2.resourceserver.jwt.audiences=tamagochirest

# Management & Actuator
management.server.port=${MANAGEMENT_PORT:9080}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# Metrics Distribution
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,500ms,1s,2s
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=3s

# OpenTelemetry Tracing
management.tracing.propagation.type=w3c
management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes.deployment.environment.name=local
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.enabled=false
management.observations.enable.spring.security=false

# Logging with Correlation IDs
logging.pattern.correlation=[${spring.application.name:},trace_id=%X{traceId:-},span_id=%X{spanId:-}]