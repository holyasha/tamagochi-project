spring.application.name=tamagochirest

# GraphiQL — интерактивная IDE для тестирования GraphQL-запросов.
# Доступна по адресу http://localhost:8080/graphiql после запуска приложения.
spring.graphql.graphiql.enabled=true

# Путь к GraphQL-endpoint
spring.graphql.path=/graphql

# Расположение GraphQL-схемы для Spring for GraphQL.
spring.graphql.schema.locations=classpath*:graphql/

# Расположение GraphQL-схемы для DGS.
# DGS использует свой собственный механизм поиска схемы, отдельный от Spring for GraphQL.
# По умолчанию: classpath*:schema/**/*.graphql* — нужно переопределить.
dgs.graphql.schema-locations=classpath*:graphql/**/*.graphqls

# Включаем интроспекцию схемы (удобно при разработке, отключите в продакшене)
spring.graphql.schema.introspection.enabled=true

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/tamagochi
spring.datasource.username=tamagochi
spring.datasource.password=tamagochi123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.com.example.tamagochirest=DEBUG
logging.level.org.springframework.web=DEBUG

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false